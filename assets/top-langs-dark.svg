  .label { font-size: 14px; fill: #c9d1d9; }
  .value { font-size: 14px; font-weight: 700; fill: #c9d1d9; }
  .muted { font-size: 12px; fill: #8b949e; }
  .icon { fill: #8b949e; }
</style>
<rect x="0.5" y="0.5" rx="6" width="494" height="194" fill="#0d1117" stroke="#30363d"/>
<text x="25" y="38" class="title">Most Used Languages</text>
