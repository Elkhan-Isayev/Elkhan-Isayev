name: Refresh profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/scripts/render_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          # A personal token in STATS_TOKEN also counts private contributions.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python .github/scripts/render_stats.py

      - name: Commit if changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "Stats unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refresh profile stats"
          git push
